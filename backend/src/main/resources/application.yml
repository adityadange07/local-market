spring:
  application:
    name: local-shop-os-api
  main:
    banner-mode: "off"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: ${DB_MIGRATIONS_ENABLED:true}
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
localshop:
  files:
    storage-root: ${FILE_STORAGE_ROOT:/var/lib/localshop/files}
    scanner:
      mode: ${FILE_SCANNER_MODE:pending}
  identity:
    otp:
      hmac-secret: ${OTP_HMAC_SECRET}
      trusted-proxy-addresses: ${OTP_TRUSTED_PROXY_ADDRESSES:}
      lifetime: ${OTP_LIFETIME:5m}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://api.localshop.example}
      audience: ${JWT_AUDIENCE:local-shop-os-api}
      signing-secret: ${JWT_SIGNING_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:10m}
      refresh-session-ttl: ${JWT_REFRESH_SESSION_TTL:30d}
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    path: /swagger-ui

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    in.localshop.os: INFO
