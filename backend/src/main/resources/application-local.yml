logging:
  level:
    in.localshop.os: INFO

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25433/localshop}
    username: ${DB_USERNAME:localshop_app}
    password: ${DB_PASSWORD:localshop_app_dev_password}
  flyway:
    user: ${DB_MIGRATION_USERNAME:localshop}
    password: ${DB_MIGRATION_PASSWORD:localshop_dev_password}
  output:
    ansi:
      enabled: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
